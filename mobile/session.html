<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CC Island - 会话管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #08080c; --bg2: #111118; --bg3: #1a1a24;
      --border: #252535; --border-subtle: rgba(255,255,255,0.05);
      --text: #ededf5; --text2: #8888a8; --text3: #55556a;
      --accent: #7c7fff; --accent-dim: rgba(124,127,255,0.12);
      --success: #34d673; --danger: #f05050; --warning: #f5a623;
      --glow-accent: rgba(124,127,255,0.25);
      --glow-success: rgba(52,214,115,0.2);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      min-width: 0;
    }
    .sidebar, .detail-hdr, .input-bar { user-select: none; }
    .sidebar { position: relative; }
    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; flex-shrink: 0; min-width: 0; overflow: hidden;
      background: linear-gradient(180deg, rgba(17,17,24,0.98), rgba(17,17,24,0.92));
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-l { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 28px; height: 28px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.3);
    }
    .header h1 {
      font-size: 16px; font-weight: 700;
      background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-r { display: flex; gap: 6px; align-items: center; }
    .pill {
      font-size: 10px; padding: 3px 8px; border-radius: 10px;
      background: rgba(255,255,255,0.04); color: var(--text2);
      border: 1px solid var(--border-subtle); white-space: nowrap;
    }
    .pill.live { border-color: rgba(52,214,115,0.3); color: var(--success); }
    .pill.live::before {
      content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
      background: var(--success); margin-right: 4px;
      box-shadow: 0 0 6px var(--glow-success);
      animation: livePulse 2s ease-in-out infinite;
    }
    @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    /* Tabs row with search */
    .tabs-row {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 12px 8px; flex-shrink: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs-row::-webkit-scrollbar { display: none; }
    .search-btn {
      background: none; border: none; color: var(--text2); cursor: pointer;
      padding: 6px; border-radius: var(--radius-sm); display: flex; flex-shrink: 0;
      transition: all 0.2s;
    }
    .search-btn:active { background: var(--accent-dim); color: var(--accent); }
    .search-btn.active { color: var(--accent); background: var(--accent-dim); }
    .search-dropdown {
      display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
      padding: 8px 12px 10px; background: var(--bg2); border-bottom: 1px solid var(--border);
    }
    .search-dropdown.show { display: block; }
    .search-dropdown input {
      width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
      background: var(--bg3); border: 1px solid var(--border);
      font-size: 13px; color: var(--text); outline: none;
      transition: border-color 0.2s;
    }
    .search-dropdown input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--glow-accent); }
    .search-dropdown input::placeholder { color: var(--text3); }
    .tab {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: var(--radius-lg); flex-shrink: 0;
      background: var(--bg3); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.2s; font-size: 11px;
      white-space: nowrap; max-width: 140px;
    }
    .tab:active { transform: scale(0.96); }
    .tab.sel { background: var(--accent-dim); border-color: rgba(124,127,255,0.35); box-shadow: 0 0 12px var(--glow-accent); }
    .tab-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .tab-name { overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .tab.sel .tab-name { color: var(--accent); font-weight: 600; }
    /* Main area */
    .main-area { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      color: var(--text2); padding: 20px;
    }
    .empty-state svg { opacity: 0.15; }
    .empty-state p { font-size: 13px; color: var(--text3); }
    /* Detail header */
    .detail-hdr {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; flex-shrink: 0;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(255,255,255,0.015);
    }
    .btn-icon {
      background: none; border: none; color: var(--text2); cursor: pointer;
      padding: 5px; border-radius: var(--radius-sm); display: flex; flex-shrink: 0;
      transition: all 0.15s;
    }
    .btn-icon:active { background: var(--accent-dim); color: var(--accent); }
    .detail-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
    .detail-info .name {
      font-size: 13px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .detail-info .meta { font-size: 10px; color: var(--text3); white-space: nowrap; }
    /* Messages */
    .msg-list {
      flex: 1; min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto;
      padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 88%; padding: 10px 14px; border-radius: 16px;
      font-size: 13.5px; line-height: 1.55;
      word-break: break-word; overflow-wrap: break-word; min-width: 0;
      animation: msgIn 0.25s ease-out;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user {
      align-self: flex-end; color: #fff; border-bottom-right-radius: 6px;
      background: linear-gradient(135deg, #6366f1, #7c7fff);
      box-shadow: 0 2px 8px rgba(99,102,241,0.25);
    }
    .msg.asst {
      align-self: flex-start; color: var(--text); border-bottom-left-radius: 6px;
      background: var(--bg3); border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .msg .ts { font-size: 9px; opacity: 0.4; margin-top: 3px; text-align: right; }
    .msg.pending { opacity: 0.6; }
    .msg.fail { border: 1px solid var(--danger); opacity: 0.5; }
    .sending-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); animation: sendPulse 0.8s ease-in-out infinite; }
    @keyframes sendPulse { 0%,100% { opacity: 0.2; } 50% { opacity: 0.8; } }
    .msg.asst code{background:rgba(255,255,255,0.06);padding:2px 5px;border-radius:4px;font-family:'Cascadia Code',monospace;font-size:11px}
    .msg.asst pre{background:rgba(0,0,0,0.3);padding:10px 12px;border-radius:var(--radius-sm);overflow-x:auto;margin:4px 0;font-size:11px;border:1px solid var(--border)}
    .msg.asst pre code{background:none;padding:0}
    .msg.asst a{color:var(--accent);text-decoration:none}
    .msg.asst a:hover{text-decoration:underline}
    .msg.asst strong{color:#fff;font-weight:700}
    .msg.asst em{color:var(--text2)}
    .msg.asst ul,.msg.asst ol{margin:4px 0;padding-left:18px}
    .msg.asst li{margin:2px 0}
    .msg.asst blockquote{border-left:3px solid var(--accent);padding-left:10px;margin:4px 0;opacity:0.85;color:var(--text2)}
    .msg.asst h1,.msg.asst h2,.msg.asst h3,.msg.asst h4{font-size:14px;font-weight:700;margin:6px 0 3px;color:#fff}
    .msg.asst hr{border:none;border-top:1px solid var(--border);margin:6px 0}
    .msg.asst table{border-collapse:collapse;font-size:11px;margin:4px 0}
    .msg.asst th,.msg.asst td{border:1px solid var(--border);padding:3px 8px}
    .msg.asst th{background:rgba(255,255,255,0.04);font-weight:600}
    .msg.user code{background:rgba(255,255,255,0.15);padding:2px 5px;border-radius:4px;font-size:11px}
    .msg.user pre{background:rgba(255,255,255,0.1);padding:10px 12px;border-radius:var(--radius-sm);overflow-x:auto;margin:4px 0;font-size:11px}
    .msg.user strong{color:#fff}
    .msg.user a{color:#c7d2fe}
    .think { align-self: flex-start; padding: 8px 14px; display: flex; gap: 3px; }
    .think i { font-style: normal; font-size: 18px; color: var(--accent); animation: dotBounce 1.2s ease-in-out infinite; }
    .think i:nth-child(1){animation-delay:0s}
    .think i:nth-child(2){animation-delay:0.2s}
    .think i:nth-child(3){animation-delay:0.4s}
    @keyframes dotBounce { 0%,60%,100%{opacity:0.1} 30%{opacity:1} }
    /* Input */
    .input-bar {
      display: flex; gap: 8px; padding: 10px 14px; flex-shrink: 0;
      background: linear-gradient(180deg, var(--bg2), rgba(17,17,24,0.98));
      border-top: 1px solid var(--border);
      padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
    }
    .input-bar input {
      flex: 1; min-width: 0; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 10px 16px; font-size: 14px; color: var(--text); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--glow-accent); }
    .input-bar input:disabled { opacity: 0.3; }
    .input-bar input::placeholder { color: var(--text3); }
    .btn-send {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      border: none; color: #fff; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6366f1, #7c7fff);
      box-shadow: 0 2px 8px rgba(99,102,241,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-send:active { transform: scale(0.92); box-shadow: 0 1px 4px rgba(99,102,241,0.2); }
    .btn-send:disabled { opacity: 0.25; box-shadow: none; }
    .btn-new-session {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle);
      color: var(--text2); cursor: pointer; padding: 4px 7px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .btn-new-session:active { background: var(--accent-dim); color: var(--accent); border-color: rgba(124,127,255,0.3); }
    .new-session-wrap { position: relative; }
    .new-session-menu {
      display: none; position: absolute; top: 100%; right: 0; z-index: 100;
      margin-top: 6px; min-width: 180px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden;
    }
    .new-session-menu.show { display: block; }
    .new-session-opt {
      display: block; width: 100%; padding: 10px 14px; border: none;
      background: none; color: var(--text); font-size: 13px; text-align: left;
      cursor: pointer; transition: background 0.15s;
    }
    .new-session-opt:active { background: var(--accent-dim); }
    .new-session-opt + .new-session-opt { border-top: 1px solid var(--border); }
    .opt-tag { display: block; font-size: 10px; color: var(--text3); margin-top: 2px; }
    /* Queue panel */
    .queue-panel { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--bg2); overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 300px; opacity: 1; }
    .queue-panel.collapsed { max-height: 36px; }
    .queue-panel-hdr { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; font-size: 10px; color: var(--text2); user-select: none; }
    .queue-panel-acts { display: flex; align-items: center; gap: 6px; }
    .btn-autoplay { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 13px; padding: 3px 5px; border-radius: 4px; opacity: 0.5; transition: all 0.15s; }
    .btn-autoplay.on { color: var(--success); opacity: 1; }
    .queue-panel-list { padding: 2px 12px 8px; display: flex; flex-direction: column; gap: 3px; max-height: 120px; overflow-y: auto; }
    .queue-cmd { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; transition: all 0.15s; user-select: none; }
    .queue-cmd:active { background: rgba(255,255,255,0.04); }
    .queue-cmd.dragging { opacity: 0.3; }
    .queue-cmd.drag-over { background: var(--accent-dim); }
    .queue-cmd-idx { font-size: 10px; color: var(--text3); width: 18px; text-align: center; flex-shrink: 0; }
    .queue-cmd-text { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .queue-cmd-send { background: none; border: none; color: var(--success); cursor: pointer; font-size: 11px; padding: 2px; border-radius: 3px; opacity: 0.4; transition: opacity 0.15s; }
    .queue-cmd-send:active { opacity: 1; }
    .queue-cmd-del { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 13px; padding: 2px; border-radius: 3px; opacity: 0.3; transition: all 0.15s; }
    .queue-cmd-del:active { opacity: 1; color: var(--danger); }
    .queue-countdown { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(245,166,35,0.05); border-top: 1px solid rgba(245,166,35,0.12); font-size: 10px; color: var(--warning); }
    .queue-countdown button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 9px; opacity: 0.6; }
    .queue-countdown button:active { opacity: 1; }
    .btn-queue-mode { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 15px; padding: 5px; border-radius: 6px; opacity: 0.5; flex-shrink: 0; transition: all 0.15s; }
    .btn-queue-mode.active { color: var(--accent); opacity: 1; background: var(--accent-dim); }
    .queue-collapse-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 10px; padding: 2px 4px; opacity: 0.4; transition: opacity 0.15s; }
    /* === PIN overlay === */
    .pin-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .pin-box { text-align: center; max-width: 300px; width: 100%; }
    .pin-box h2 { font-size: 20px; margin-bottom: 8px; font-weight: 700; }
    .pin-box .sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
    .pin-input {
      width: 100%; padding: 12px 16px; border-radius: 14px; text-align: center;
      font-size: 26px; letter-spacing: 10px; font-family: monospace;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); outline: none; margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow-accent); }
    .pin-btn {
      width: 100%; padding: 12px; border-radius: 14px; border: none;
      color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      background: linear-gradient(135deg, #6366f1, #7c7fff);
      box-shadow: 0 2px 10px rgba(99,102,241,0.3);
    }
    .pin-btn:active { transform: scale(0.97); }
    .pin-btn:disabled { opacity: 0.5; box-shadow: none; }
    .pin-err { font-size: 11px; color: var(--danger); margin-top: 10px; min-height: 18px; }
    .pin-pending { font-size: 11px; color: var(--warning); margin-top: 10px; }
    /* App UI */
    #appUi { flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
    /* Desktop */
    @media (min-width: 640px) {
      #appUi { flex-direction: row; }
      .tabs-row { flex: 1; min-height: 0; flex-direction: column; gap: 0; padding: 0; overflow: hidden; }
      .search-btn { display: none; }
      .search-dropdown { display: flex; position: static; padding: 8px 10px; background: transparent; border-bottom: 1px solid var(--border); }
      .search-dropdown input { background: var(--bg3); border: 1px solid var(--border); }
      .sidebar {
        width: 260px; max-width: 40vw; flex-shrink: 0;
        display: flex; flex-direction: column; overflow: hidden;
        border-right: 1px solid var(--border); background: var(--bg2);
      }
      .tabs-row { flex: 1; min-height: 0; flex-direction: column; padding: 0 10px; overflow: hidden; }
      .tabs-row { flex-direction: column; overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; padding: 0 10px; }
      .tab {
        border-radius: 6px; border: 1px solid transparent; max-width: none;
        padding: 6px 10px; font-size: 12px; width: 100%; box-sizing: border-box;
        transition: all 0.15s;
      }
      .tab:hover { background: rgba(255,255,255,0.03); }
      .tab.sel { background: rgba(99,102,241,0.1); border-color: rgba(99,102,241,0.2); }
      .tab.sel .tab-name { color: var(--accent); font-weight: 600; }
    }
  </style>
</head>
<body>
  <!-- PIN Login Overlay -->
  <div class="pin-overlay" id="pinOverlay">
    <div class="pin-box">
      <h2>CC Island</h2>
      <p class="sub">请输入 6 位数访问密码</p>
      <input type="text" class="pin-input" id="pinInput" inputmode="numeric" maxlength="6" placeholder="000000" autofocus />
      <button class="pin-btn" id="pinBtn">验证</button>
      <div class="pin-err" id="pinErr"></div>
      <div class="pin-pending" id="pinPending" style="display:none">等待桌面端审批...</div>
    </div>
  </div>

  <!-- Main UI (hidden until auth) -->
  <div id="appUi" style="display:none">
  <div class="sidebar" id="sidebar">
    <div class="header">
      <div class="header-l"><div class="logo">🏝</div><h1>CC Island</h1></div>
      <div class="header-r">
        <div class="new-session-wrap" id="newSessionWrap">
          <button class="btn-new-session" id="btnNewSession" title="新建 Claude CMD">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="new-session-menu" id="newSessionMenu">
            <button class="new-session-opt" data-mode="normal">普通模式</button>
            <button class="new-session-opt" data-mode="skip">跳过权限 <span class="opt-tag">--dangerously-skip-permissions</span></button>
          </div>
        </div>
        <span class="pill" id="wsBadge">连接中</span>
        <span class="pill" id="cntBadge">0</span>
      </div>
    </div>
    <div class="search-dropdown" id="searchDropdown">
      <input type="text" id="searchInput" placeholder="搜索会话..." />
    </div>
    <div class="tabs-row" id="tabList">
      <button class="search-btn" id="searchBtn" title="搜索">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    </div>
  </div>

  <div class="main-area" id="mainArea">
    <div class="empty-state" id="emptyState">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M8 12h8M12 8v8"/></svg>
      <p id="emptyText">暂无活跃的 Claude 会话</p>
    </div>
    <div class="detail-hdr" id="detailHdr" style="display:none">
      <button class="btn-icon" id="btnBack"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="detail-info"><span class="name" id="detailName"></span><span class="meta" id="detailMeta"></span></div>
      <button class="btn-icon" id="btnFocus" style="display:none" title="弹出 CMD"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
    </div>
    <div class="msg-list" id="msgList"></div>
    <div class="queue-panel" id="queuePanel" style="display:none">
      <div class="queue-panel-hdr" id="queuePanelHdr">
        <span id="queueHdrLabel" style="flex:1">指令队列 (<span id="queueCount">0</span>)</span>
        <div class="queue-panel-acts">
          <button id="queueClear" title="清空队列" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:10px;opacity:0.4;padding:2px 4px;">清空</button>
          <button class="btn-autoplay" id="btnAutoPlay" title="自动执行">▶</button>
          <button class="queue-collapse-btn" id="queueCollapseBtn" title="收起">▲</button>
        </div>
      </div>
      <div class="queue-panel-list" id="queueList"></div>
    </div>
    <div class="input-bar" id="inputBar" style="display:none">
      <input type="text" id="msgInput" placeholder="输入指令..." />
      <button class="btn-queue-mode" id="btnQueueMode" title="切换队列模式">📋</button>
      <button class="btn-send" id="sendBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>
  </div>
  </div>

  <script src="/lib/fp/fp.umd.min.js"></script>
  <script src="/lib/marked/marked.umd.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/mobile/shared.js"></script>
  <script src="/mobile/session-client.js"></script>
  <script>
  (function() {
    // ===== Auth state =====
    var accessPin = '';
    var deviceId = '';

    // Load/save deviceId from localStorage
    function getDeviceId() {
      var stored = localStorage.getItem('cc-island-device-id');
      if (stored) return stored;
      // Try FPJS, fallback to random
      if (typeof FingerprintJS !== 'undefined') {
        FingerprintJS.load().then(function(fp) { return fp.get(); }).then(function(r) {
          var id = r.visitorId;
          localStorage.setItem('cc-island-device-id', id);
          deviceId = id;
        }).catch(function() {
          deviceId = 'dev-' + Math.random().toString(36).substring(2, 12);
          localStorage.setItem('cc-island-device-id', deviceId);
        });
        return stored || 'pending';
      }
      var fallback = 'dev-' + Math.random().toString(36).substring(2, 12);
      localStorage.setItem('cc-island-device-id', fallback);
      return fallback;
    }

    deviceId = getDeviceId();

    // URL params
    var urlSid = window.location.pathname.split('/').pop();
    var urlParams = new URLSearchParams(window.location.search);
    var urlPin = urlParams.get('pin') || '';

    // ===== PIN Login =====
    var $pinOverlay = document.getElementById('pinOverlay');
    var $pinInput = document.getElementById('pinInput');
    var $pinBtn = document.getElementById('pinBtn');
    var $pinErr = document.getElementById('pinErr');
    var $pinPending = document.getElementById('pinPending');
    var $appUi = document.getElementById('appUi');

    // Load cached PIN
    var cachedPin = '';
    try { cachedPin = sessionStorage.getItem('cc-island-pin') || ''; } catch(e) {}
    if (urlPin) {
      $pinInput.value = urlPin;
    } else if (cachedPin) {
      $pinInput.value = cachedPin;
    }

    function tryAuth(pin) {
      $pinErr.textContent = '';
      $pinPending.style.display = 'none';

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/auth');
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function() {
        try { var r = JSON.parse(xhr.responseText); } catch(e) { r = null; }
        if (!r) { $pinErr.textContent = '请求失败'; return; }
        if (r.ok) {
          accessPin = pin;
          try { sessionStorage.setItem('cc-island-pin', pin); } catch(e) {}
          $pinOverlay.style.display = 'none';
          $appUi.style.display = 'flex';
          try { history.replaceState({}, '', location.pathname); } catch(e) {}
          initApp();
        } else if (r.pending) {
          $pinPending.style.display = 'block';
          var pollTimer = setInterval(function() {
            var px = new XMLHttpRequest();
            px.open('POST', '/api/auth');
            px.setRequestHeader('Content-Type', 'application/json');
            px.onload = function() {
              try { var pr = JSON.parse(px.responseText); } catch(e) { return; }
              if (pr && pr.ok) {
                clearInterval(pollTimer);
                accessPin = pin;
                try { sessionStorage.setItem('cc-island-pin', pin); } catch(e) {}
                $pinOverlay.style.display = 'none';
                $appUi.style.display = 'flex';
                try { history.replaceState({}, '', location.pathname); } catch(e) {}
                initApp();
              }
            };
            px.send(JSON.stringify({ pin: pin, deviceId: deviceId, deviceName: navigator.userAgent.substring(0, 50) }));
          }, 3000);
        } else {
          if (r.reason === 'pin') { try { sessionStorage.removeItem('cc-island-pin'); } catch(e) {} }
          $pinErr.textContent = r.reason === 'pin' ? '密码错误' : r.reason === 'device_rejected' ? '设备未获授权' : '验证失败';
        }
      };
      xhr.onerror = function() { $pinErr.textContent = '无法连接到服务器'; };
      xhr.send(JSON.stringify({ pin: pin, deviceId: deviceId, deviceName: navigator.userAgent.substring(0, 50) }));
    }

    $pinBtn.addEventListener('click', function() {
      var pin = $pinInput.value.trim();
      if (pin.length !== 6) { $pinErr.textContent = '请输入6位数字密码'; return; }
      tryAuth(pin);
    });
    $pinInput.addEventListener('input', function() {
      var val = $pinInput.value.replace(/\D/g, '').substring(0, 6);
      $pinInput.value = val;
      if (val.length === 6) tryAuth(val);
    });
    $pinInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { var v = $pinInput.value.trim(); if (v.length === 6) tryAuth(v); }
    });

    // Auto-try cached or URL pin
    var autoPin = urlPin || cachedPin;
    if (autoPin && autoPin.length === 6) {
      setTimeout(function() { tryAuth(autoPin); }, 300);
    }

    // ===== Main App (only after auth) =====
    var client = new SessionClient();
    function initApp() {
      if (!deviceId || deviceId === 'pending') {
        if (typeof FingerprintJS !== 'undefined') {
          FingerprintJS.load().then(function(fp) { return fp.get(); }).then(function(r) {
            deviceId = r.visitorId;
            localStorage.setItem('cc-island-device-id', deviceId);
            startClient();
          });
        } else {
          deviceId = 'dev-' + Math.random().toString(36).substring(2, 12);
          localStorage.setItem('cc-island-device-id', deviceId);
          startClient();
        }
        return;
      }
      startClient();
    }

    function startClient() {
      client.connect(accessPin, deviceId, navigator.userAgent.substring(0, 50));
      setupApp();
    }

    // ===== App (uses SessionClient) =====
    function setupApp() {
    // DOM
    var $tabList = document.getElementById('tabList');
    var $searchInput = document.getElementById('searchInput');
    var $wsBadge = document.getElementById('wsBadge');
    var $cntBadge = document.getElementById('cntBadge');
    var $emptyState = document.getElementById('emptyState');
    var $detailHdr = document.getElementById('detailHdr');
    var $detailName = document.getElementById('detailName');
    var $detailMeta = document.getElementById('detailMeta');
    var $msgList = document.getElementById('msgList');
    var $inputBar = document.getElementById('inputBar');
    var $msgInput = document.getElementById('msgInput');
    var $sendBtn = document.getElementById('sendBtn');
    var $btnBack = document.getElementById('btnBack');
    var $btnFocus = document.getElementById('btnFocus');
    var $btnNewSession = document.getElementById('btnNewSession');
    var $btnQueueMode = document.getElementById('btnQueueMode');
    var $queuePanel = document.getElementById('queuePanel');
    var $queueCount = document.getElementById('queueCount');
    var $queueList = document.getElementById('queueList');
    var $queueCollapseBtn = document.getElementById('queueCollapseBtn');
    var $btnAutoPlay = document.getElementById('btnAutoPlay');
    var $queueClear = document.getElementById('queueClear');
    // Countdown: integrated into first queue item via countdown variable + renderQueue

    var allSessions = [];
    var selectedId = null;
    var messageCount = 0;
    var isSending = false;
    var followBottom = true;
    var inputCache = {};
    var msgIdSeq = 0;
    var pendingMsgs = {};
    var lastStatus = '';
    var lastRenderedSeq = -1; // highest seq rendered, for gap detection
    var msgCache = {}; // sessionId → { messages, count, status }
    // Load cached messages from sessionStorage
    try {
      var keys = Object.keys(sessionStorage);
      for (var k = 0; k < keys.length; k++) {
        if (keys[k].indexOf('cc-msg-') === 0) {
          try {
            var sid = keys[k].replace('cc-msg-', '');
            var data = JSON.parse(sessionStorage.getItem(keys[k]));
            if (data && data.messages) msgCache[sid] = data;
          } catch(e) {}
        }
      }
    } catch(e) {}

    function saveMsgCache(id, data) {
      // Only cache last 50 messages per session
      var msgs = (data.messages || []).slice(-200);
      var slim = { messages: msgs, count: data.count, status: data.status };
      msgCache[id] = slim;
      try { sessionStorage.setItem('cc-msg-' + id, JSON.stringify(slim)); } catch(e) {}
    }

    function onConnected() {
      $wsBadge.textContent = '已连接';
      $wsBadge.className = 'pill live';
      loadSessionList();
      if (selectedId) {
        client.joinSession(selectedId);
        loadSessionDetail(selectedId);
      }
    }
    client.on('connect', onConnected);

    client.on('disconnect', function() {
      $wsBadge.textContent = '断开';
      $wsBadge.className = 'pill';
    });

    client.on('send-error', function(data) {
      // Session was removed before message could be delivered
      Object.keys(pendingMsgs).forEach(function(cid) {
        var p = pendingMsgs[cid];
        clearTimeout(p.timer);
        p.el.classList.add('fail');
        p.el.classList.remove('pending');
        delete pendingMsgs[cid];
      });
    });

    client.on('auth-error', function(data) {
      accessPin = '';
      try { sessionStorage.removeItem('cc-island-pin'); } catch(e) {}
      $appUi.style.display = 'none';
      $pinOverlay.style.display = 'flex';
      $pinErr.textContent = data.reason === 'pin' ? '密码已变更，请重新输入' : '设备权限已被撤销';
    });

    client.on('ping', function() { client.pong(); });

    client.on('sessions-updated', function(list) {
      if (!list) return;
      // Compare ID+status hash to detect additions, removals, or status changes
      var prevHash = allSessions.map(function(s){return s.id + ':' + s.status;}).sort().join(',');
      var newHash = list.map(function(s){return s.id + ':' + s.status;}).sort().join(',');
      allSessions = list;
      $cntBadge.textContent = allSessions.length;
      if (allSessions.length === 0) { selectedId = null; hideDetail(); }
      if (prevHash !== newHash || allSessions.length === 0) {
        renderTabs();
      }
      if (selectedId) {
        var s = allSessions.find(function(s){return s.id===selectedId});
        if (s) { updateDetailHeader(s); addThinkDot(s); }
        else { selectedId = null; hideDetail(); }
      }
      if (!selectedId && allSessions.length > 0) {
        selectSession(allSessions[0].id);
      }
    });

    client.on('session-messages', function(data) {
      if (!data || data.sessionId !== selectedId) return;
      if (data.delta && data.delta.length > 0) {
        // Sort delta by seq
        var delta = data.delta.slice().sort(function(a, b) { return (a.seq || 0) - (b.seq || 0); });
        // Check for gap: first delta seq should be lastRenderedSeq + 1
        var firstSeq = delta[0].seq;
        if (firstSeq !== undefined && lastRenderedSeq >= 0 && firstSeq > lastRenderedSeq + 1) {
          // Gap detected — HTTP fetch to fill missing messages, then apply delta
          loadSessionDetail(selectedId);
          return;
        }
        // Reset lastRenderedSeq if we're starting fresh (e.g. lastRenderedSeq is -1 or seq restarted)
        if (firstSeq !== undefined && (lastRenderedSeq < 0 || firstSeq <= lastRenderedSeq + 1)) {
          var consumed = confirmPending(delta);
          delta.forEach(function(m) {
            if (m.role === 'user' && consumed.has(m.content)) return;
            appendMsg(m);
            if (m.seq !== undefined) lastRenderedSeq = Math.max(lastRenderedSeq, m.seq);
          });
          messageCount = data.messages ? data.messages.length : (messageCount + delta.length);
          if (data.messages) {
            saveMsgCache(data.sessionId, { messages: data.messages, count: data.messages.length, status: data.status });
          }
          // Status and think dots are handled by sessions-updated — don't override here
          if (followBottom) scrollToBottom();
        }
      }
    });

    function loadSessionList() { client.getSessionList(function(list) {
      if (!list) return;
      allSessions = list;
      $cntBadge.textContent = allSessions.length;
      renderTabs();
      if (allSessions.length === 0) { selectedId = null; hideDetail(); return; }
      if (selectedId && !allSessions.find(function(s){return s.id===selectedId})) { selectSession(allSessions[0].id); }
      if (!selectedId) {
        var autoId = (urlSid && allSessions.find(function(s){return s.id===urlSid})) ? urlSid : allSessions[0].id;
        selectSession(autoId);
      }
    });}

    function loadSessionDetail(id) { client.getSessionDetail(id, function(detail) {
      if (!detail || detail.id !== selectedId) return;
      var newCount = detail.messages ? detail.messages.length : 0;
      var cached = msgCache[id];
      // If cache is up-to-date, skip DOM rebuild
      if (cached && cached.count === newCount) {
        updateDetailHeader(detail);
        addThinkDot(detail);
        if (followBottom) scrollToBottom();
        return;
      }
      // Update cache and rebuild
      saveMsgCache(id, { messages: detail.messages || [], count: newCount, status: detail.status });
      messageCount = newCount;
      updateDetailHeader(detail);
      $msgList.innerHTML = '';
      if (detail.messages && detail.messages.length > 0) {
        detail.messages.forEach(function(m) { appendMsg(m); });
        // Update lastRenderedSeq from loaded messages to prevent gap detection loop
        var maxSeq = -1;
        for (var i = 0; i < detail.messages.length; i++) {
          if (detail.messages[i].seq !== undefined && detail.messages[i].seq > maxSeq) maxSeq = detail.messages[i].seq;
        }
        lastRenderedSeq = maxSeq >= 0 ? maxSeq : detail.messages.length - 1;
      } else {
        $msgList.innerHTML = '<div class="msg sys">暂无对话记录</div>';
      }
      addThinkDot(detail);
      if (followBottom) scrollToBottom();
    });}

    function appendMsg(msg) {
      var div = document.createElement('div');
      var role = msg.role || 'system';
      div.className = 'msg ' + (role === 'assistant' ? 'asst' : role === 'user' ? 'user' : 'sys');
      div.innerHTML = '<div>' + renderContent(msg.content || '') + '</div><div class="ts">' + formatTime(msg.timestamp) + '</div>';
      $msgList.appendChild(div);
    }

    function addThinkDot(s) {
      var st = s ? s.status : '';
      var old = $msgList.querySelector('.think');
      // Status unchanged, dots exist and at bottom — skip
      if (st === lastStatus && old && old === $msgList.lastElementChild) return;
      if (old) old.remove();
      lastStatus = st;
      if (st === 'thinking' || st === 'answering') {
        var dots = document.createElement('div');
        dots.className = 'think';
        dots.innerHTML = '<i>.</i><i>.</i><i>.</i>';
        $msgList.appendChild(dots);
      }
    }

    function renderTabs() {
      var q = $searchInput.value.trim().toLowerCase();
      var filtered = q ? allSessions.filter(function(s) {
        return s.name.toLowerCase().indexOf(q) >= 0 || (s.cwd && s.cwd.toLowerCase().indexOf(q) >= 0);
      }) : allSessions;
      $tabList.innerHTML = '';
      if (filtered.length === 0) { $tabList.innerHTML = '<div style="padding:16px;text-align:center;font-size:11px;color:var(--text2)">无匹配会话</div>'; return; }
      filtered.forEach(function(s) {
        var el = document.createElement('div');
        el.className = 'tab' + (s.id === selectedId ? ' sel' : '');
        var name = (s.name || 'Claude').replace(/^\[[^\]]+\]\s*/, '');
        el.innerHTML = '<span class="tab-dot" style="background:' + (STATUS_COLORS[s.status] || STATUS_COLORS.disconnected) + '"></span><span class="tab-name">' + escapeHtml(name) + '</span>';
        el.addEventListener('click', function() { selectSession(s.id); });
        $tabList.appendChild(el);
      });
    }

    function selectSession(id) {
      if (selectedId === id) return;
      if (selectedId) { inputCache[selectedId] = $msgInput.value; client.leaveSession(selectedId); }
      selectedId = id;
      lastStatus = '';
      lastRenderedSeq = -1;
      followBottom = true;
      if (!id) { hideDetail(); renderTabs(); return; }
      client.joinSession(id);
      // Sync queue mode from backend
      client.getQueueMode(id, function(v) { applyQueueMode(!!v); });
      showDetail();
      renderTabs();
      $msgList.innerHTML = '';
      $msgInput.value = inputCache[id] || '';
      // Show cached messages instantly
      var cached = msgCache[id];
      if (cached && cached.messages) {
        messageCount = cached.count;
        cached.messages.forEach(function(m) { appendMsg(m); });
        addThinkDot({ status: cached.status || '' });
        if (followBottom) scrollToBottom();
      }
      // Fetch from server to verify/update
      loadSessionDetail(id);
    }

    function showDetail() { $emptyState.style.display = 'none'; $detailHdr.style.display = 'flex'; $msgList.style.display = 'flex'; $inputBar.style.display = 'flex'; if (queueMode) $queuePanel.style.display = 'block'; setTimeout(function(){ $msgInput.focus(); }, 100); }
    function hideDetail() { $emptyState.style.display = 'flex'; $detailHdr.style.display = 'none'; $msgList.style.display = 'none'; $inputBar.style.display = 'none'; $queuePanel.style.display = 'none'; $msgList.innerHTML = ''; lastStatus = ''; }

    function updateDetailHeader(s) {
      $detailName.textContent = s.name || 'Claude';
      var dur = s.workingDuration ? formatDuration(s.workingDuration) : '';
      var st = STATUS_MAP[s.status] || s.status || '';
      $detailMeta.textContent = [dur, st].filter(Boolean).join(' · ');
      var active = s.status === 'working' || s.status === 'thinking' || s.status === 'answering';
      $btnFocus.style.display = active ? 'flex' : 'none';
    }

    var queueMode = false;
    var autoPlay = true;
    var countdown = 0;
    var countdownTimer = null;
    // Backend handles all queue execution — frontend only displays countdown

    function sendOrEnqueue() {
      var text = $msgInput.value.trim();
      if (!text || !selectedId) return;
      $msgInput.value = '';
      if (queueMode) {
        client.addToQueue(selectedId, text);
        $msgInput.focus();
        return;
      }
      isSending = true;
      $sendBtn.disabled = true;
      var clientId = 'msg-' + (++msgIdSeq);
      var el = appendPendingMsg(text, clientId);
      followBottom = true;
      scrollToBottom();
      var timer = setTimeout(function() {
        if (pendingMsgs[clientId]) { pendingMsgs[clientId].el.classList.add('fail'); pendingMsgs[clientId].el.classList.remove('pending'); delete pendingMsgs[clientId]; }
      }, 60000);
      pendingMsgs[clientId] = { el: el, content: text, timer: timer };
      client.sendMessage(selectedId, text);
      setTimeout(function() { isSending = false; $sendBtn.disabled = false; $msgInput.focus(); }, 600);
    }

    function sendMessage() { sendOrEnqueue(); }

    function appendPendingMsg(text, clientId) {
      var div = document.createElement('div');
      div.className = 'msg user pending';
      div.setAttribute('data-cid', clientId);
      div.innerHTML = '<div>' + renderContent(text) + '</div><div class="ts"><span class="sending-dot"></span></div>';
      $msgList.appendChild(div);
      return div;
    }

    function confirmPending(delta) {
      var consumed = new Set();
      for (var i = 0; i < delta.length; i++) {
        var m = delta[i];
        if (m.role !== 'user') continue;
        var content = m.content || '';
        var keys = Object.keys(pendingMsgs);
        for (var k = 0; k < keys.length; k++) {
          var cid = keys[k];
          var p = pendingMsgs[cid];
          if (p.content === content) {
            clearTimeout(p.timer);
            p.el.classList.remove('pending');
            var ts = p.el.querySelector('.ts');
            if (ts) ts.textContent = formatTime(m.timestamp);
            delete pendingMsgs[cid];
            consumed.add(content);
            break;
          }
        }
      }
      return consumed;
    }

    function scrollToBottom() { $msgList.scrollTop = $msgList.scrollHeight; }

    // Search toggle
    var $searchBtn = document.getElementById('searchBtn');
    var $searchDropdown = document.getElementById('searchDropdown');
    $searchBtn.addEventListener('click', function() {
      var show = !$searchDropdown.classList.contains('show');
      $searchDropdown.classList.toggle('show', show);
      $searchBtn.classList.toggle('active', show);
      if (show) setTimeout(function() { $searchInput.focus(); }, 100);
      else { $searchInput.value = ''; renderTabs(); }
    });
    // Queue mode — sync UI with backend state
    function applyQueueMode(on) {
      queueMode = on;
      $btnQueueMode.className = 'btn-queue-mode' + (on ? ' active' : '');
      $sendBtn.style.background = on ? 'rgba(99,102,241,0.15)' : '';
      $sendBtn.style.color = on ? 'var(--accent)' : '';
      $sendBtn.innerHTML = on ? '+Q' : '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z\"/></svg>';
      $queuePanel.style.display = on ? 'block' : 'none';
      $msgInput.placeholder = on ? '输入指令加入队列...' : '输入指令...';
    }
    $btnQueueMode.addEventListener('click', function() {
      var next = !queueMode;
      client.setQueueMode(selectedId, next);
      applyQueueMode(next);
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      countdown = 0; fetchQueue();
      if (!next) { autoPlay = false; $btnAutoPlay.className = 'btn-autoplay'; $btnAutoPlay.textContent = '▶'; client.setAutoPlay(selectedId, false); }
    });
    // Events
    $searchInput.addEventListener('input', renderTabs);
    $sendBtn.addEventListener('click', sendOrEnqueue);
    $msgInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); sendOrEnqueue(); } });
    $btnBack.addEventListener('click', function() {
      if (selectedId) client.leaveSession(selectedId);
      selectedId = null; hideDetail(); renderTabs();
    });
    $btnFocus.addEventListener('click', function() { if (selectedId) client.focusSession(selectedId); });
    // New session — show mode menu
    var $newSessionMenu = document.getElementById('newSessionMenu');
    $btnNewSession.addEventListener('click', function(e) {
      e.stopPropagation();
      $newSessionMenu.classList.toggle('show');
    });
    document.addEventListener('click', function() { $newSessionMenu.classList.remove('show'); });
    $newSessionMenu.addEventListener('click', function(e) {
      var btn = e.target.closest('.new-session-opt');
      if (!btn) return;
      $newSessionMenu.classList.remove('show');
      var cwd = selectedId ? (allSessions.find(function(s){return s.id===selectedId}) || {}).cwd : '';
      var skip = btn.getAttribute('data-mode') === 'skip';
      client.newSession(cwd, skip ? { dangerouslySkipPermissions: true } : {});
    });

    // === Command Queue (new design) ===
    var renderQueue = function(q, ap) {
      $queueCount.textContent = q.length;
      $queueList.innerHTML = '';
      if (q.length === 0 && !queueMode) { $queuePanel.style.display = 'none'; }
      else if (queueMode) { $queuePanel.style.display = 'block'; }
      if (ap !== undefined) {
        autoPlay = ap;
        $btnAutoPlay.textContent = ap ? '⏸' : '▶';
        $btnAutoPlay.className = 'btn-autoplay' + (ap ? ' on' : '');
      }
      q.forEach(function(cmd, i) {
        var el = document.createElement('div');
        el.className = 'queue-cmd';
        el.setAttribute('draggable', 'true');
        var isCountdown = (i === 0 && countdown > 0);
        el.innerHTML = '<span class="queue-cmd-idx' + (isCountdown ? ' countdown' : '') + '" title="' + (i === 0 ? '下一条执行' : '第' + (i + 1) + '条') + '">' + (isCountdown ? countdown + 's' : i === 0 ? '▶' : i + 1) + '</span>' +
          '<span class="queue-cmd-text">' + escapeHtml(cmd) + '</span>' +
          '<button class="queue-cmd-send">▶</button><button class="queue-cmd-del">×</button>';
        el.querySelector('.queue-cmd-send').addEventListener('click', function() { if (i === 0) { client.sendNextFromQueue(selectedId); } else { client.removeFromQueue(selectedId, i); } });
        el.querySelector('.queue-cmd-del').addEventListener('click', function() { client.removeFromQueue(selectedId, i); });
        el.addEventListener('dragstart', function(e) { el.classList.add('dragging'); e.dataTransfer.setData('text/plain', String(i)); });
        el.addEventListener('dragend', function() { el.classList.remove('dragging'); });
        el.addEventListener('dragover', function(e) { e.preventDefault(); el.classList.add('drag-over'); });
        el.addEventListener('dragleave', function() { el.classList.remove('drag-over'); });
        el.addEventListener('drop', function(e) { e.preventDefault(); el.classList.remove('drag-over'); var from = parseInt(e.dataTransfer.getData('text/plain')); if (!isNaN(from) && from !== i) client.reorderQueue(selectedId, from, i); });
        $queueList.appendChild(el);
      });
    };
    function fetchQueue() { if (!selectedId) return; client.getQueue(selectedId, function(r) { if (r) { renderQueue(r.queue || [], r.autoPlay); if (r.autoPlay !== undefined) { autoPlay = r.autoPlay; $btnAutoPlay.textContent = autoPlay ? '⏸' : '▶'; $btnAutoPlay.className = 'btn-autoplay' + (autoPlay ? ' on' : ''); if (autoPlay && queueMode) { true; client.setAutoPlay(selectedId, true); } else { ; } } else { ; } } }); }
    client.on('queue-changed', function(data) { if (data.sessionId !== selectedId) return; fetchQueue(); if (data.autoPlay !== undefined) { autoPlay = data.autoPlay; $btnAutoPlay.textContent = data.autoPlay ? '⏸' : '▶'; $btnAutoPlay.className = 'btn-autoplay' + (data.autoPlay ? ' on' : ''); } if (data.queueMode !== undefined) applyQueueMode(data.queueMode); }); // backend poll runs independently
    client.on('queue-data', function(data) { if (data.sessionId !== selectedId) return; renderQueue(data.queue || [], data.autoPlay); if (data.autoPlay && queueMode) true; });
    client.on('queue-auto-ready', function(data) { if (data.sessionId !== selectedId) return; countdown = 2; fetchQueue(); if (countdownTimer) clearInterval(countdownTimer); countdownTimer = setInterval(function() { countdown--; if (countdown <= 0) { clearInterval(countdownTimer); countdownTimer = null; countdown = 0; client.sendNextFromQueue(selectedId); } else { fetchQueue(); } }, 1000); });
    // Cancel via pause (⏸) or mode switch (📋) — countdown shows on first queue item
    $btnAutoPlay.addEventListener('click', function() { autoPlay = !autoPlay; $btnAutoPlay.textContent = autoPlay ? '⏸' : '▶'; $btnAutoPlay.className = 'btn-autoplay' + (autoPlay ? ' on' : ''); client.setAutoPlay(selectedId, autoPlay); if (autoPlay) true; else ; if (!autoPlay) { if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; } countdown = 0; fetchQueue(); } });
    $queueClear.addEventListener('click', function() { if (selectedId) client.clearQueue(selectedId); });
    $queueCollapseBtn.addEventListener('click', function() {
      var panel = document.getElementById('queuePanel');
      var collapsed = panel.classList.toggle('collapsed');
      document.getElementById('queueList').style.display = collapsed ? 'none' : '';
      $queueCollapseBtn.textContent = collapsed ? '▼' : '▲';
    });
    var origSelectSession = selectSession;
    selectSession = function(id) {
      origSelectSession(id);
      if (id) fetchQueue();
    };
    $msgList.addEventListener('scroll', function() { followBottom = ($msgList.scrollHeight - $msgList.scrollTop - $msgList.clientHeight) < 20; });
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(function() {
        if (followBottom) scrollToBottom();
      });
      ro.observe($msgList);
    }
    window.addEventListener('resize', function() {
      if (followBottom) scrollToBottom();
    });

    // Initial load — if socket already connected, kick off immediately
    if (client.socket && client.socket.connected) onConnected();
    loadSessionList();
    if (urlSid) { selectedId = urlSid; showDetail(); loadSessionDetail(urlSid); }
    } // end setupSocket
  })();
  </script>
</body>
</html>
