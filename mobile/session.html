<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CC Island - Claude 遥控器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0d12;
      --bg2: #16161e;
      --bg3: #1e1e2a;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --text2: #9898b0;
      --accent: #6366f1;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Header */
    .header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .subtitle {
      font-size: 11px;
      color: var(--text2);
      margin-top: 4px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.working {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(99,102,241,0.6);
      animation: pulse 1.5s infinite;
    }
    .status-dot.completed {
      background: var(--success);
      box-shadow: 0 0 8px rgba(34,197,94,0.6);
    }
    @keyframes pulse {
      0%,100% { opacity:1; }
      50% { opacity:0.4; }
    }
    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      animation: msgIn 0.3s ease-out;
    }
    @keyframes msgIn {
      from { opacity:0; transform: translateY(8px); }
      to { opacity:1; transform: translateY(0); }
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--bg3);
      color: var(--text);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    .msg .msg-time {
      font-size: 9px;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--text2);
      font-size: 11px;
      padding: 4px 12px;
    }
    /* Input */
    .input-bar {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .input-bar input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }
    .input-bar input:focus {
      border-color: var(--accent);
    }
    .input-bar button {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .input-bar button:active {
      transform: scale(0.95);
    }
    .input-bar button:disabled {
      opacity: 0.4;
    }
    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 100;
      animation: toastIn 0.3s ease-out;
    }
    @keyframes toastIn {
      from { opacity:0; transform: translateX(-50%) translateY(-10px); }
      to { opacity:1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 CC Island 遥控器</h1>
    <div class="subtitle" id="sessionName">连接中...</div>
    <div class="status-bar">
      <span class="status-dot working" id="statusDot"></span>
      <span id="statusText">连接中</span>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg system">正在连接 Claude 会话...</div>
  </div>

  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="输入指令..." />
    <button id="sendBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const sessionId = window.location.pathname.split('/').pop();
    const socket = io();

    const messagesEl = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const sessionNameEl = document.getElementById('sessionName');

    let isConnected = false;

    socket.on('connect', () => {
      socket.emit('join-session', sessionId);
    });

    socket.on('session-data', (session) => {
      sessionNameEl.textContent = session.name || 'Claude 会话';
      updateStatus(session.status);
      if (session.messages) {
        messagesEl.innerHTML = '';
        session.messages.forEach(addMessage);
      }
    });

    socket.on('session-updated', (session) => {
      updateStatus(session.status);
    });

    socket.on('new-message', (msg) => {
      addMessage(msg);
      scrollToBottom();
    });

    function updateStatus(status) {
      statusDot.className = 'status-dot ' + status;
      const statusMap = {
        working: 'Claude 工作中',
        thinking: 'Claude 思考中',
        completed: '已完成',
        error: '发生错误',
        disconnected: '已断开'
      };
      statusText.textContent = statusMap[status] || status;
    }

    function addMessage(msg) {
      const div = document.createElement('div');
      div.className = 'msg ' + (msg.role || 'system');
      div.innerHTML = `
        <div class="msg-text">${escapeHtml(msg.content || '')}</div>
        <div class="msg-time">${formatTime(msg.timestamp)}</div>
      `;
      messagesEl.appendChild(div);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = '';
      socket.emit('send-message', { sessionId, message: text });
      addMessage({ role: 'user', content: text, timestamp: new Date().toISOString() });
      scrollToBottom();
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-focus input
    msgInput.focus();
  </script>
</body>
</html>
